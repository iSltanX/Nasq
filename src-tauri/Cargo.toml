[package]
name = "nasaq"
version = "9.0.0"
description = "أداة شخصية لتنسيق النصوص العربية إيقاعيًا للنشر"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
# نظام التحديثات (المرحلة 1 — نائم بلا مفتاح ولا endpoint، لا أثر سلوكي بعد)
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
# فتح روابط خارجية في المتصفح الافتراضي (رابط «صفحة المشروع» في «حول») —
# دون مغادرة نافذة التطبيق. الصلاحية مقيّدة بنطاق github.com في القدرات.
tauri-plugin-opener = "2"

# إطار النافذة الأصلي في الماك (src/app/window.rs): حزم objc2 حاضرة أصلًا في
# شجرة tauri نفسها — الاعتماد المباشر يفعّل سمات AppKit/Foundation المستعملة فقط
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSAppearance", "NSButton", "NSControl", "NSResponder", "NSToolbar", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSLocale", "NSNotification", "NSOperation", "NSString", "block2"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
