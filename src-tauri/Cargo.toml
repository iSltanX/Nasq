[package]
name = "nasaq"
version = "4.2.0"
description = "أداة شخصية لتنسيق النصوص العربية إيقاعيًا للنشر"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
