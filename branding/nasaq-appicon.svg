    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.38"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="182"/></clipPath>
  </defs>

  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="182" fill="#12100C"/>
  </g>
  <g clip-path="url(#body)">
