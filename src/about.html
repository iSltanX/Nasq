<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>حول نَسَق</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="secondary.css" />
  </head>
  <!-- لوحة «حول» ٣٢٠×٣٠٠ (About-Window 2009:2911): أيقونة ٨٠، فالاسم Window Title،
       فالإصدار بلون الوحدة، فالوعد، فخطّ، فالحقوق -->
  <body data-window="about" data-tauri-drag-region>
    <!-- الدوران لا الوسوم: اللوحة مقيسة ٣٢٠×٣٠٠ بالنقطة، وتبديل <p> بـ<h1>
         يجرّ مقاسًا وهوامش افتراضية تزحزح القياس. الدور يعطي المعلمَ والعنوان
         لقارئ الشاشة وحده -->
    <div class="about" role="main">
      <img src="app-icon.png" alt="أيقونة نَسَق" width="80" height="80" />
      <p class="app-name" role="heading" aria-level="1">نَسَق</p>
      <p class="app-version">الإصدار <span id="app-version" dir="ltr"></span></p>
      <p class="app-promise">صوتك محفوظ، وشكل نصك أوضح. رفيقك لتنسيق العربية.</p>
      <p class="app-rights">
        © ٢٠٢٦ سلطان ·
        <button type="button" class="link" id="site-link" dir="ltr"></button>
      </p>
    </div>
    <script src="app-links.js"></script>
    <script src="app-version.js"></script>
    <script src="appearance.js"></script>
    <script src="secondary.js"></script>
    <script src="about.js"></script>
  </body>
</html>
